<!DOCTYPE html>
<html>
<body>
<!-- Within a sentence you want to change the style of your document we use span tag -->
<p>My mother has <span style="color:blue;font-weight:bold">blue</span> eyes and my father has <span style="color:green;font-weight:bold">dark green</span> eyes.</p>

<p><span>one</span> <span>two</span> <span>three</span></p>
</body>
</html>
